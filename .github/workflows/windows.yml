name: Windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-x64:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      SOURCE_DATE_EPOCH: "315532800"
      REYN_RESEARCH_SOURCE_DIR: ${{ github.workspace }}/reyn-monorepo/reyn-research
      REYN_ACCESS_REQUIRED: "1"
      REYN_ACCESS_ENDPOINT: https://reynflow.com/api/yc-access/v1/session
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out research runtime source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: videochataiai/reyn
          ref: 2339de95e2f60ecb04187a68a7257f9713bd65e6
          path: reyn-monorepo
          ssh-key: ${{ secrets.REYN_RESEARCH_DEPLOY_KEY }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pins = Get-Content "packaging/windows/release-pins.json" | ConvertFrom-Json
          rustup toolchain install $pins.rust_toolchain `
            --profile minimal `
            --component rustfmt `
            --target $pins.target
          if ($LASTEXITCODE -ne 0) { throw "rustup toolchain install failed with exit code $LASTEXITCODE" }
          rustup default $pins.rust_toolchain
          if ($LASTEXITCODE -ne 0) { throw "rustup default failed with exit code $LASTEXITCODE" }

      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      - name: Check Rust formatting
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt failed with exit code $LASTEXITCODE" }

      - name: Run Rust tests and checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          uv sync --project $env:REYN_RESEARCH_SOURCE_DIR --frozen
          if ($LASTEXITCODE -ne 0) { throw "research environment sync failed with exit code $LASTEXITCODE" }
          $testPython = Join-Path $env:REYN_RESEARCH_SOURCE_DIR ".venv/Scripts/python.exe"
          uv pip install --python $testPython `
            --require-hashes `
            --index-url https://download.pytorch.org/whl/cpu `
            --extra-index-url https://pypi.org/simple `
            --index-strategy unsafe-best-match `
            --requirements "packaging/windows/python-runtime.lock"
          if ($LASTEXITCODE -ne 0) { throw "pinned test runtime installation failed with exit code $LASTEXITCODE" }
          $env:REYN_PYTHON = $testPython
          cargo test --locked --all-targets
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed with exit code $LASTEXITCODE" }
          cargo check --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "cargo check failed with exit code $LASTEXITCODE" }
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed with exit code $LASTEXITCODE" }

      - name: Run Windows packaging tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m unittest discover -s tests -p "test_windows_*.py"
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging tests failed with exit code $LASTEXITCODE" }

      - name: Assemble pinned CPU runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pins = Get-Content "packaging/windows/release-pins.json" | ConvertFrom-Json
          uv python install $pins.python
          if ($LASTEXITCODE -ne 0) { throw "uv python install failed with exit code $LASTEXITCODE" }
          $python = (uv python find $pins.python).Trim()
          if ($LASTEXITCODE -ne 0) { throw "uv python find failed with exit code $LASTEXITCODE" }
          $source = Split-Path $python
          $runtime = Join-Path $env:RUNNER_TEMP "ReynPython"
          Copy-Item $source $runtime -Recurse
          uv pip install --python (Join-Path $runtime "python.exe") `
            --system `
            --break-system-packages `
            --require-hashes `
            --index-url https://download.pytorch.org/whl/cpu `
            --extra-index-url https://pypi.org/simple `
            --index-strategy unsafe-best-match `
            --requirements "packaging/windows/python-runtime.lock"
          if ($LASTEXITCODE -ne 0) { throw "uv pip install failed with exit code $LASTEXITCODE" }
          uv pip uninstall --python (Join-Path $runtime "python.exe") `
            --system `
            --break-system-packages `
            pip
          if ($LASTEXITCODE -ne 0) { throw "uv pip uninstall failed with exit code $LASTEXITCODE" }
          "REYN_WINDOWS_RUNTIME_DIR=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build and validate portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/package_windows.py `
            --runtime-dir "$env:REYN_WINDOWS_RUNTIME_DIR" `
            --research-source-dir "$env:REYN_RESEARCH_SOURCE_DIR" `
            --binary "target/release/reyn-studio.exe" `
            --runtime-smoke
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging failed with exit code $LASTEXITCODE" }
          $stage = Get-ChildItem "dist/windows" -Directory | Select-Object -First 1
          python scripts/validate_windows_package.py "$($stage.FullName)" --runtime-smoke
          if ($LASTEXITCODE -ne 0) { throw "Windows package validation failed with exit code $LASTEXITCODE" }

      - name: Engine readiness and gated launch cleanup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Get-ChildItem "dist/windows" -Directory | Select-Object -First 1
          python scripts/windows_engine_smoke.py "$($stage.FullName)"
          if ($LASTEXITCODE -ne 0) { throw "Windows engine smoke failed with exit code $LASTEXITCODE" }
          $exe = Join-Path $stage.FullName "Reyn Studio.exe"
          $process = Start-Process $exe -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline -and -not $process.HasExited) {
            $process.Refresh()
            if ($process.MainWindowHandle -ne 0) { break }
            Start-Sleep -Milliseconds 500
          }
          if ($process.HasExited -or $process.MainWindowHandle -eq 0) {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            throw "Reyn Studio did not reach the running YC access gate."
          }
          $preUnlockEngine = Get-CimInstance Win32_Process |
            Where-Object {
              $_.ParentProcessId -eq $process.Id -and
              $_.Name -eq "python.exe" -and
              $_.CommandLine -match "reyn_engine.py"
            } |
            Select-Object -First 1
          if ($preUnlockEngine) {
            Stop-Process -Id $preUnlockEngine.ProcessId -Force
            Stop-Process -Id $process.Id -Force
            throw "YC-gated Reyn Studio started its engine before authentication."
          }
          Stop-Process -Id $process.Id -Force
          if (-not $process.WaitForExit(15000)) {
            throw "Reyn Studio did not terminate under CI runner control."
          }
          Start-Sleep -Seconds 2
          $orphan = Get-CimInstance Win32_Process |
            Where-Object {
              $_.ParentProcessId -eq $process.Id -and
              $_.Name -eq "python.exe" -and
              $_.CommandLine -match "reyn_engine.py"
            } |
            Select-Object -First 1
          if ($orphan) {
            Stop-Process -Id $orphan.ProcessId -Force
            throw "Bundled Python engine remained after runner-controlled termination."
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reyn-studio-windows-x64-unverified
          path: |
            dist/windows/*.zip
            dist/windows/SHA256SUMS
          if-no-files-found: error
