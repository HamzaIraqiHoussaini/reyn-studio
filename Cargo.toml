[package]
name = "reyn-studio"
version = "0.4.1"
edition = "2021"
description = "Native desktop studio for fluid-flow cases, model results, and evidence"

[package.metadata.reyn-macos]
bundle-identifier = "com.reyn.studio"
display-name = "Reyn Studio"
category = "public.app-category.productivity"
minimum-system-version = "11.0"

[lib]
name = "reyn_studio"
path = "src/lib.rs"

[[bin]]
name = "reyn-cad-bridge"
path = "src/bin/reyn_cad_bridge.rs"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["wgpu", "default_fonts", "persistence", "accesskit"] }
egui = "0.35"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
rfd = "0.17.2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
fontdue = "0.9"
png = "0.18"
base64 = "0.22"
ed25519-dalek = "3"
getrandom = "0.4"
zeroize = "1"
egui-phosphor = "0.13.0"
ureq = { version = "3.3.0", default-features = false, features = ["json", "rustls"] }
truck-stepio = "0.3.0"
truck-meshalgo = { version = "0.4.0", default-features = false, features = ["tessellation"] }
zip = { version = "2", default-features = false, features = ["deflate", "deflate-flate2"] }
roxmltree = "0.20"
semver = { version = "1.0.28", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.19.3"
security-framework = { version = "3.7", features = ["OSX_10_15"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native"] }

[build-dependencies]
winres = "0.1.12"

[dev-dependencies]
pollster = "0.4"
# Shader validation without an adapter: the GPU render tests silently skip on
# machines with no wgpu adapter, so WGSL is parsed and validated separately.
naga = { version = "29", features = ["wgsl-in"] }

[profile.dev]
opt-level = 1          # keep the 3D viewport smooth even in debug builds

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
